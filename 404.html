<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page not found | Open Agent Internet</title>
    <link rel="icon" type="image/png" href="/generated/oai-mark-v1.png" />
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f4ee;
        color: #151515;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }
      main {
        width: min(520px, calc(100% - 40px));
        text-align: center;
      }
      img {
        width: 44px;
        height: 44px;
        border-radius: 10px;
      }
      .mark {
        display: flex;
        justify-content: center;
        margin-bottom: 28px;
      }
      p {
        color: #69645b;
        line-height: 1.65;
      }
      a {
        display: inline-block;
        margin-top: 12px;
        padding: 9px 14px;
        border: 1px solid #151515;
        border-radius: 8px;
        color: inherit;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark"><img src="/generated/oai-mark-v1.png" alt="Open Agent Internet" /></div>
      <h1>Page not found</h1>
      <p>The address may have changed, or the page may no longer exist.</p>
      <a href="/">Return home</a>
    </main>
  </body>
</html>
