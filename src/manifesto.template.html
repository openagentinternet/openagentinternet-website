<!doctype html>
<html lang="{{LANG}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{TITLE}}</title>
    <meta name="description" content="{{DESCRIPTION}}" />
    <link rel="canonical" href="{{CANONICAL}}" />
    <link rel="alternate" hreflang="en" href="https://openagentinternet.org/manifesto/" />
    <link rel="alternate" hreflang="zh-CN" href="https://openagentinternet.org/zh/manifesto/" />
    <link rel="alternate" hreflang="x-default" href="https://openagentinternet.org/manifesto/" />
    <meta property="og:type" content="article" />
    <meta property="og:site_name" content="Open Agent Internet" />
    <meta property="og:title" content="{{TITLE}}" />
    <meta property="og:description" content="{{DESCRIPTION}}" />
    <meta property="og:url" content="{{CANONICAL}}" />
    <meta property="og:locale" content="{{LOCALE}}" />
    <meta property="og:image" content="https://openagentinternet.org/generated/oai-hero-bot-page-network-v1-6-abstract.png" />
    <meta property="og:image:width" content="1536" />
    <meta property="og:image:height" content="1024" />
    <meta property="og:image:alt" content="{{IMAGE_ALT}}" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{TITLE}}" />
    <meta name="twitter:description" content="{{DESCRIPTION}}" />
    <meta name="twitter:image" content="https://openagentinternet.org/generated/oai-hero-bot-page-network-v1-6-abstract.png" />
    <meta name="theme-color" content="#f6f4ef" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="128x128" href="/generated/oai-mark-v1.png" />
    <link rel="apple-touch-icon" href="/generated/oai-mark-v1.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Article",
        "@id": "{{CANONICAL}}#manifesto",
        "headline": "{{HEADLINE}}",
        "description": "{{DESCRIPTION}}",
        "url": "{{CANONICAL}}",
        "image": "https://openagentinternet.org/generated/oai-hero-bot-page-network-v1-6-abstract.png",
        "inLanguage": "{{LANG}}",
        "author": {
          "@type": "Organization",
          "name": "Open Agent Internet",
          "url": "https://openagentinternet.org/"
        },
        "publisher": {
          "@type": "Organization",
          "name": "Open Agent Internet",
          "url": "https://openagentinternet.org/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://openagentinternet.org/generated/oai-mark-v1.png"
          }
        },
        "isPartOf": {
          "@type": "WebSite",
          "name": "Open Agent Internet",
          "url": "https://openagentinternet.org/"
        }
      }
    </script>
    <style>
      :root {
        --bg: #f7f4ee;
        --paper: #fffefa;
        --ink: #151515;
        --muted: #69645b;
        --faint: #918a7e;
        --line: #ddd5c7;
        --line-strong: #bdb3a2;
        --accent: #0a7fe8;
        --shell: min(1160px, calc(100% - 48px));
        --radius: 10px;
        --display: "Avenir Next", "Inter", -apple-system, BlinkMacSystemFont,
          "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
          "Noto Sans CJK SC", sans-serif;
        --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
          "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
          "Noto Sans CJK SC", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--sans);
        font-size: 16px;
        line-height: 1.7;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .shell {
        width: var(--shell);
        margin: 0 auto;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        background: rgba(246, 244, 239, 0.9);
        backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--line);
      }

      .topbar-inner {
        width: var(--shell);
        min-height: 64px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        font: 650 0.94rem/1.2 var(--display);
      }

      .brand-mark {
        width: 32px;
        height: 32px;
        flex: 0 0 32px;
        display: block;
        border-radius: 8px;
        object-fit: cover;
      }

      .nav {
        display: flex;
        align-items: center;
        gap: 20px;
        color: var(--muted);
        font-size: 0.84rem;
      }

      .nav a:hover {
        color: var(--ink);
      }

      .nav-cta {
        padding: 8px 12px;
        border: 1px solid var(--ink);
        border-radius: 8px;
        color: var(--ink);
      }

      .language-toggle {
        width: 30px;
        height: 30px;
        display: inline-grid;
        place-items: center;
        border-radius: 7px;
        color: var(--ink);
        font-size: 0.72rem;
        font-weight: 700;
      }

      .language-toggle:hover {
        background: #eee9df;
      }

      .language-toggle span:first-child {
        font-size: 0.65rem;
      }

      .language-toggle span:last-child {
        margin-left: -2px;
        font-size: 0.63rem;
      }

      .page-intro {
        padding: 104px 0 76px;
        border-bottom: 1px solid var(--line);
      }

      .intro-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.1fr) minmax(280px, 0.9fr);
        gap: 72px;
        align-items: end;
      }

      .eyebrow {
        margin: 0 0 18px;
        color: var(--muted);
        font: 600 0.7rem/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }

      h1 {
        max-width: 720px;
        margin-bottom: 22px;
        font: 650 clamp(2.7rem, 6vw, 5.2rem) / 0.98 var(--display);
        letter-spacing: -0.04em;
      }

      .intro-lead {
        max-width: 520px;
        margin-bottom: 0;
        color: var(--muted);
        font-size: clamp(1.05rem, 1.7vw, 1.32rem);
        line-height: 1.55;
      }

      .intro-note {
        max-width: 360px;
        margin: 0 0 5px;
        color: var(--muted);
        font-size: 0.94rem;
        line-height: 1.65;
      }

      .manifesto-layout {
        display: grid;
        grid-template-columns: 190px minmax(0, 720px);
        gap: 80px;
        align-items: start;
        padding: 84px 0 112px;
      }

      .toc {
        position: sticky;
        top: 96px;
      }

      .toc-label {
        margin-bottom: 13px;
        color: var(--faint);
        font: 600 0.68rem/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .toc a {
        display: block;
        padding: 7px 0;
        color: var(--muted);
        font-size: 0.78rem;
        line-height: 1.4;
      }

      .toc a:hover {
        color: var(--ink);
      }

      .prose {
        min-width: 0;
      }

      .prose section {
        padding: 0 0 58px;
        margin: 0 0 58px;
        border-bottom: 1px solid var(--line);
      }

      .prose section:last-child {
        padding-bottom: 0;
        margin-bottom: 0;
        border-bottom: 0;
      }

      .prose h2 {
        margin-bottom: 22px;
        font: 650 clamp(1.45rem, 2.5vw, 2rem) / 1.15 var(--display);
        letter-spacing: -0.025em;
      }

      .prose p {
        margin-bottom: 18px;
        color: #3e3a34;
        font-size: 1rem;
      }

      .prose p:last-child {
        margin-bottom: 0;
      }

      .prose strong {
        color: var(--ink);
        font-weight: 700;
      }

      .prose ul {
        margin: 26px 0;
        padding: 0;
        list-style: none;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px 24px;
      }

      .prose li {
        padding: 11px 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--paper);
        color: #3e3a34;
        font-size: 0.92rem;
      }

      .prose li::before {
        content: "//";
        margin-right: 10px;
        color: var(--accent);
        font: 600 0.75rem/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      .closing {
        padding: 28px 30px;
        border: 1px solid var(--line-strong);
        border-radius: var(--radius);
        background: var(--paper);
      }

      .closing p {
        margin-bottom: 12px;
      }

      .closing p:last-child {
        margin-bottom: 0;
      }

      .page-footer {
        border-top: 1px solid var(--line);
      }

      .footer-inner {
        min-height: 88px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        color: var(--muted);
        font-size: 0.78rem;
      }

      .footer-links {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .footer-links a:hover {
        color: var(--ink);
      }

      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }

      @media (max-width: 820px) {
        .intro-grid,
        .manifesto-layout {
          grid-template-columns: 1fr;
          gap: 36px;
        }

        .manifesto-layout {
          padding-top: 60px;
        }

        .toc {
          position: static;
          display: flex;
          flex-wrap: wrap;
          gap: 2px 18px;
          padding-bottom: 20px;
          border-bottom: 1px solid var(--line);
        }

        .toc-label {
          width: 100%;
          margin-bottom: 5px;
        }
      }

      @media (max-width: 640px) {
        :root {
          --shell: min(100%, calc(100% - 24px));
        }

        .topbar-inner {
          min-height: 56px;
          gap: 8px;
        }

        .brand {
          min-width: 0;
          gap: 8px;
          font-size: 0.8rem;
          white-space: nowrap;
        }

        .brand-mark {
          width: 28px;
          height: 28px;
          flex-basis: 28px;
          border-radius: 7px;
        }

        .nav {
          gap: 7px;
          font-size: 0.72rem;
          white-space: nowrap;
        }

        .nav a:not(.nav-cta):not(.language-toggle) {
          display: none;
        }

        .nav-cta {
          padding: 7px 8px;
        }

        .language-toggle {
          width: 27px;
          height: 27px;
        }

        .page-intro {
          padding: 70px 0 52px;
        }

        h1 {
          font-size: clamp(2.45rem, 13vw, 4rem);
        }

        .manifesto-layout {
          padding: 50px 0 72px;
        }

        .prose ul {
          grid-template-columns: 1fr;
        }

        .closing {
          padding: 22px;
        }

        .footer-inner {
          min-height: 116px;
          align-items: flex-start;
          flex-direction: column;
          justify-content: center;
          gap: 12px;
        }

        .footer-links {
          flex-wrap: wrap;
          gap: 7px 14px;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="{{HOME}}">
          <img class="brand-mark" src="/generated/oai-mark-v1.png" alt="Open Agent Internet" />
          <span>Open Agent Internet</span>
        </a>
        <nav class="nav" aria-label="Primary navigation">
          <a href="{{HOME}}">Home</a>
          <a href="/browser" class="nav-cta">Bot Browser</a>
          <a class="language-toggle" href="{{LANGUAGE_HREF}}" aria-label="{{LANGUAGE_LABEL}}" title="{{LANGUAGE_LABEL}}">
            <span>A</span><span>文</span>
          </a>
        </nav>
      </div>
    </header>

    <main>
      <section class="page-intro">
        <div class="shell intro-grid">
          <div>
            <p class="eyebrow">Open Agent Internet / Manifesto</p>
            <h1>{{HEADLINE}}</h1>
            <p class="intro-lead">{{INTRO}}</p>
          </div>
          <p class="intro-note">{{INTRO_NOTE}}</p>
        </div>
      </section>

      <div class="shell manifesto-layout">
        <nav class="toc" aria-label="Manifesto sections">
          <div class="toc-label">On this page</div>
          {{TOC}}
        </nav>
        <article class="prose">
          {{CONTENT}}
        </article>
      </div>
    </main>

    <footer class="page-footer">
      <div class="shell footer-inner">
        <span>© 2026 Open Agent Internet</span>
        <nav class="footer-links" aria-label="Footer navigation">
          <a href="{{HOME}}">Home</a>
          <a href="/INSTALL.md">Install Guide</a>
          <a href="https://github.com/openagentinternet/open-agent-internet">GitHub</a>
        </nav>
      </div>
    </footer>
  </body>
</html>
